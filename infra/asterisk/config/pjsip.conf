[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

;=============== Extension 1000 ===============
; Extension 1000 now lives in PostgreSQL (ps_endpoints, ps_auths, ps_aors).
; 1001 stays here deliberately - both mechanisms run side by side.

;=============== Extension 1001 ===============

[1001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=1001
aors=1001
direct_media=no
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
callerid=Bob <1001>

[1001]
type=auth
auth_type=userpass
username=1001
password=Str0ngPass1001

[1001]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30