[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
RINGTIME=20

;================================================================
; Building blocks - never assigned to an endpoint directly
;================================================================

[diagnostics]

exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

exten => 601,1,NoOp(Playback test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-congrats)
 same => n,Hangup()

exten => 602,1,NoOp(Read back my own caller ID)
 same => n,Answer()
 same => n,Wait(1)
 same => n,SayDigits(${CALLERID(num)})
 same => n,Hangup()

[feature-codes]

; *97 - my own mailbox
exten => *97,1,NoOp(Voicemail login for ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; *98 - log in to any mailbox
exten => *98,1,NoOp(Voicemail login, prompt for mailbox)
 same => n,Answer()
 same => n,Wait(1)
 same => n,VoiceMailMain(@default)
 same => n,Hangup()

[internal-extensions]

exten => _1XXX,1,NoOp(Call ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(TARGET=${EXTEN})
 same => n,Dial(PJSIP/${TARGET},${RINGTIME},tT)
 same => n,Goto(vm-${DIALSTATUS},1)

exten => vm-NOANSWER,1,NoOp(No answer, sending to voicemail)
 same => n,VoiceMail(${TARGET}@default,u)
 same => n,Hangup()

exten => vm-BUSY,1,NoOp(Busy, sending to voicemail)
 same => n,VoiceMail(${TARGET}@default,b)
 same => n,Hangup()

; Everything else: CHANUNAVAIL, CONGESTION, CANCEL...
exten => _vm-.,1,NoOp(Dial failed: ${DIALSTATUS})
 same => n,Playback(the-party-you-are-calling&is-curntly-unavail)
 same => n,Hangup()

;================================================================
; Contexts actually assigned to endpoints
;================================================================

[from-internal]
include => diagnostics
include => feature-codes
include => internal-extensions

; Deliberately restricted - can only reach test extensions.
; Demonstrates the boundary; used in a later phase for untrusted peers.
[from-guest]
include => diagnostics