[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

;=============== Internal extensions ===============

[from-internal]

exten => _1XXX,1,NoOp(Call from ${CALLERID(num)} to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

; Echo test - proves two-way audio
exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

; Playback test - proves one-way audio
exten => 601,1,NoOp(Playback test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-congrats)
 same => n,Hangup()