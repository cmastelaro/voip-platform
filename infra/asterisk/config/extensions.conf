[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
RINGTIME=20
RECDIR=/recordings

;================================================================
; Building blocks
;================================================================

[diagnostics]

exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

exten => 601,1,NoOp(Playback test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-congrats)
 same => n,Hangup()

exten => 602,1,NoOp(Read back caller ID)
 same => n,Answer()
 same => n,Wait(1)
 same => n,SayDigits(${CALLERID(num)})
 same => n,Hangup()

exten => 603,1,NoOp(Music on hold test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,MusicOnHold(default,30)
 same => n,Hangup()

exten => 800,1,NoOp(Handing channel to ARI application)
 same => n,Answer()
 same => n,Stasis(voip-platform)
 same => n,Hangup()

[feature-codes]

exten => *97,1,NoOp(Voicemail for ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

exten => *98,1,NoOp(Voicemail, prompt for mailbox)
 same => n,Answer()
 same => n,Wait(1)
 same => n,VoiceMailMain(@default)
 same => n,Hangup()

; Record the IVR greeting from any handset
exten => *90,1,NoOp(Recording IVR greeting)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Record(custom/ivr-greeting.wav,3,60,k)
 same => n,Wait(1)
 same => n,Playback(custom/ivr-greeting)
 same => n,Hangup()

[internal-extensions]

exten => _1XXX,1,NoOp(Call ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(TARGET=${EXTEN})
 same => n,Set(CALLFILE=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-${TARGET}-${UNIQUEID})
 same => n,MixMonitor(${RECDIR}/${CALLFILE}.wav,b)
 same => n,Dial(PJSIP/${TARGET},${RINGTIME},tT)
 same => n,Goto(vm-${DIALSTATUS},1)

exten => vm-NOANSWER,1,NoOp(No answer -> voicemail)
 same => n,VoiceMail(${TARGET}@default,u)
 same => n,Hangup()

exten => vm-BUSY,1,NoOp(Busy -> voicemail)
 same => n,VoiceMail(${TARGET}@default,b)
 same => n,Hangup()

exten => _vm-.,1,NoOp(Dial failed: ${DIALSTATUS})
 same => n,Playback(the-party-you-are-calling&is-curntly-unavail)
 same => n,Hangup()

[ivr-entry]

exten => 700,1,NoOp(Entering main IVR)
 same => n,Goto(ivr-main,s,1)

;================================================================
; IVR menu
;================================================================

[ivr-main]

exten => s,1,NoOp(IVR main menu)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(TIMEOUT(digit)=3)
 same => n,Set(ATTEMPT=0)
 same => n(menu),Set(ATTEMPT=$[${ATTEMPT} + 1])
 same => n,GotoIf($[${ATTEMPT} > 3]?giveup)
 same => n,Background(custom/ivr-greeting)
 same => n,WaitExten(7)
 same => n(giveup),Playback(vm-goodbye)
 same => n,Hangup()

exten => 1,1,NoOp(Option 1 - extension 1000)
 same => n,Playback(pls-hold-while-try)
 same => n,Goto(internal-extensions,1000,1)

exten => 2,1,NoOp(Option 2 - extension 1001)
 same => n,Playback(pls-hold-while-try)
 same => n,Goto(internal-extensions,1001,1)

exten => 9,1,NoOp(Option 9 - echo test)
 same => n,Goto(diagnostics,600,1)

exten => i,1,NoOp(Invalid entry)
 same => n,Playback(invalid)
 same => n,Goto(s,menu)

exten => t,1,NoOp(No input)
 same => n,Goto(s,menu)

;================================================================
; Assigned contexts
;================================================================

[from-internal]
include => diagnostics
include => feature-codes
include => internal-extensions
include => ivr-entry

[from-guest]
include => diagnostics
include => ivr-entry