; Section headers correspond to the module that REGISTERS each object type.
; endpoint, auth and aor are all registered by res_pjsip itself.
; Only contact belongs to res_pjsip_registrar, and identify to
; res_pjsip_endpoint_identifier_ip.
;
; Declaring a wizard replaces the built-in default, so the config wizard
; is listed explicitly to keep reading pjsip.conf alongside the database.

[res_pjsip]
endpoint=config,pjsip.conf,criteria=type=endpoint
endpoint=realtime,ps_endpoints
auth=config,pjsip.conf,criteria=type=auth
auth=realtime,ps_auths
aor=config,pjsip.conf,criteria=type=aor
aor=realtime,ps_aors

[res_pjsip_endpoint_identifier_ip]
identify=config,pjsip.conf,criteria=type=identify
identify=realtime,ps_endpoint_id_ips

[res_pjsip_registrar]
contact=realtime,ps_contacts